[tool.poetry]
name = "multimodal-enterprise-rag"
version = "0.1.0"
description = ""
authors = ["somiaamari <amarisomia0@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
python-dotenv = ">=1.0,<2"
qdrant-client = ">=1.7,<2"
llama-index = ">=0.14,<0.15"
llama-index-vector-stores-qdrant = ">=0.10,<0.11"
llama-index-embeddings-fastembed = ">=0.7,<0.8"
fastembed = ">=0.8,<0.9"
llama-index-llms-openai-like = ">=0.7,<0.8"
llama-index-retrievers-bm25 = ">=0.7,<0.8"
llama-parse = ">=0.6,<0.7"
chainlit = ">=2.12,<3"
pandas = ">=2.0,<3"
pillow = ">=10,<13"
requests = ">=2.31,<3"
huggingface-hub = ">=0.23,<2"

[tool.poetry.group.dev.dependencies]
black = ">=24,<27"
isort = ">=5,<10"
mypy = ">=1.8,<3"
pytest = ">=8,<10"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88