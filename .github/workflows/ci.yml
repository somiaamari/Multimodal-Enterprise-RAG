name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies (including dev)
        run: poetry install --no-interaction --no-root

      - name: Check formatting with Black
        run: poetry run black --check app/ scripts/

      - name: Check import order with isort
        run: poetry run isort --check-only app/ scripts/

      - name: Type check with mypy
        run: poetry run mypy app/ --ignore-missing-imports || true

      - name: Run tests
        run: poetry run pytest tests/ -v || echo "No tests yet"